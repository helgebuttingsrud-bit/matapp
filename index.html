<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mat">
<meta name="theme-color" content="#eef2f1">
<title>Mat</title>
<style>
  :root {
    --paper: #eef2f1; --card: #ffffff; --ink: #12242b; --muted: #5d7279; --line: #cfdad8;
    --fridge: #177e72; --freezer: #2f5fa7; --warn: #c9701a; --bad: #b8382b;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #0f1b20; --card: #172830; --ink: #e8f0ef; --muted: #8fa5ab; --line: #28404a;
            --fridge: #3fb5a5; --freezer: #6b9be0; --warn: #e8953f; --bad: #e66b5d; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--paper); color: var(--ink);
    font: 16px/1.4 -apple-system, system-ui, "Helvetica Neue", sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); max-width: 520px; margin: 0 auto; }

  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0 10px; }
  h1 { font-size: 26px; font-weight: 800; letter-spacing: -0.02em; margin: 0; }
  .gear { background: none; border: 0; color: var(--muted); font-size: 22px; padding: 8px; }

  .modes { display: grid; grid-template-columns: 1fr 1fr; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 14px; }
  .modes button { border: 0; background: none; color: var(--muted); font-weight: 700; font-size: 16px;
    padding: 12px; border-radius: 10px; }
  .modes button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

  #reader { width: 100%; border-radius: 16px; overflow: hidden; background: #000; min-height: 200px; }
  .hint { color: var(--muted); text-align: center; margin: 10px 0 0; }
  .ghost { display: block; width: 100%; margin-top: 12px; padding: 14px; border-radius: 12px; font-size: 16px;
    font-weight: 600; background: none; border: 1px dashed var(--line); color: var(--ink); }

  .sheet { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
  label { display: block; font-weight: 700; font-size: 14px; margin: 16px 0 6px; }
  label:first-child { margin-top: 0; }
  input[type=text], input[type=date], input[type=number] { width: 100%; font: inherit; padding: 13px 12px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
  .sub { color: var(--muted); font-size: 14px; margin: 4px 0 0; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 4px; min-height: 18px; }

  .loc { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .loc button { border: 2px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 14px;
    padding: 22px 8px; font-size: 18px; font-weight: 800; }
  .loc button[data-loc="Kjøleskap"][aria-pressed="true"] { background: var(--fridge); border-color: var(--fridge); color: #fff; }
  .loc button[data-loc="Fryser"][aria-pressed="true"] { background: var(--freezer); border-color: var(--freezer); color: #fff; }

  .quick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .quick button { border: 1px solid var(--line); background: var(--paper); color: var(--ink); border-radius: 10px;
    padding: 12px 4px; font-size: 15px; font-weight: 600; }
  .quick button:active { background: var(--line); }

  .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; margin-top: 20px; }
  .actions button { border-radius: 12px; padding: 16px; font-size: 17px; font-weight: 800; border: 0; }
  .cancel { background: var(--paper); color: var(--ink); border: 1px solid var(--line) !important; }
  .save { background: var(--ink); color: var(--paper); }
  .save:disabled { opacity: .4; }

  #toast { position: fixed; left: 16px; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom)); max-width: 488px;
    margin: 0 auto; padding: 14px 16px; border-radius: 12px; background: var(--ink); color: var(--paper);
    font-weight: 600; opacity: 0; transform: translateY(8px); transition: opacity .2s, transform .2s; pointer-events: none; }
  #toast.show { opacity: 1; transform: none; }
  #toast.err { background: var(--bad); color: #fff; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<header>
  <h1>Mat</h1>
  <button class="gear" id="gear" aria-label="Innstillinger">⚙</button>
</header>

<div class="modes" role="group" aria-label="Modus">
  <button id="m-add" aria-pressed="true">Legg inn</button>
  <button id="m-use" aria-pressed="false">Fjern</button>
</div>

<section id="scan">
  <div id="reader"></div>
  <p class="hint" id="hint">Hold strekkoden foran kameraet.</p>
  <button class="ghost" id="manual">Legg inn uten strekkode</button>
</section>

<section id="form" class="sheet" hidden>
  <label for="name">Navn</label>
  <input type="text" id="name" autocomplete="off" autocapitalize="sentences">
  <div class="meta" id="info"></div>

  <label>Plassering</label>
  <div class="loc">
    <button data-loc="Kjøleskap" aria-pressed="false">Kjøleskap</button>
    <button data-loc="Fryser" aria-pressed="false">Fryser</button>
  </div>

  <label for="bb">Best før</label>
  <div class="quick" id="quick">
    <button data-d="3">+3 dager</button>
    <button data-d="7">+1 uke</button>
    <button data-d="14">+2 uker</button>
    <button data-m="1">+1 mnd</button>
    <button data-m="3">+3 mnd</button>
    <button data-m="6">+6 mnd</button>
  </div>
  <input type="date" id="bb">

  <label for="limit">Varsle når det er igjen (dager)</label>
  <input type="number" id="limit" inputmode="numeric" min="0" placeholder="Standard for plasseringen">
  <p class="sub">La stå tomt for å bruke standardgrensen.</p>

  <div class="actions">
    <button class="cancel" id="cancel">Avbryt</button>
    <button class="save" id="save" disabled>Lagre vare</button>
  </div>
</section>

<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
const $ = id => document.getElementById(id);
let mode = 'add';          // 'add' | 'use'
let current = null;        // { barcode, brand, quantity }
let loc = null;
let busy = false;

/* ---------- Oppsett (lagres kun på denne telefonen) ---------- */
function loadCfg() { return { url: localStorage.getItem('url') || '', token: localStorage.getItem('token') || '' }; }
function askCfg() {
  const c = loadCfg();
  const url = prompt('Apps Script web-app-URL (slutter på /exec):', c.url);
  if (url === null) return false;
  const token = prompt('Token (fra fanen Innstillinger i arket):', c.token);
  if (token === null) return false;
  localStorage.setItem('url', url.trim());
  localStorage.setItem('token', token.trim());
  return true;
}
$('gear').onclick = askCfg;

async function api(body) {
  const c = loadCfg();
  if (!c.url || !c.token) { if (!askCfg()) throw new Error('Mangler oppsett'); return api(body); }
  const r = await fetch(c.url, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // unngår CORS-preflight mot Apps Script
    body: JSON.stringify({ ...body, token: loadCfg().token })
  });
  return r.json();
}

/* ---------- UI-hjelpere ---------- */
let toastTimer;
function toast(msg, err) {
  const t = $('toast');
  t.textContent = msg; t.className = 'show' + (err ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = '', 2600);
}
const iso = d => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

function setMode(m) {
  mode = m;
  $('m-add').setAttribute('aria-pressed', m === 'add');
  $('m-use').setAttribute('aria-pressed', m === 'use');
  $('manual').hidden = m !== 'add';
  $('hint').textContent = m === 'add' ? 'Hold strekkoden foran kameraet.' : 'Skann varen du har brukt opp.';
}
$('m-add').onclick = () => setMode('add');
$('m-use').onclick = () => setMode('use');

/* ---------- Skanner ---------- */
let scanner;
async function startScan() {
  $('form').hidden = true; $('scan').hidden = false;
  try {
    if (!scanner) {
      const F = Html5QrcodeSupportedFormats;
      scanner = new Html5Qrcode('reader', {
        formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E],
        experimentalFeatures: { useBarCodeDetectorIfSupported: true },
        verbose: false
      });
    }
    await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 280, height: 140 } }, onScan, () => {});
  } catch (e) {
    toast('Fikk ikke tilgang til kamera. Sjekk tillatelser i Safari.', true);
  }
}
async function stopScan() {
  try { if (scanner && scanner.isScanning) await scanner.stop(); } catch (e) {}
}

async function onScan(code) {
  if (busy) return;
  busy = true;
  if (navigator.vibrate) navigator.vibrate(60);
  await stopScan();
  try {
    if (mode === 'use') await handleUse(code); else await handleAdd(code);
  } finally { busy = false; }
}

/* ---------- Fjern-modus ---------- */
async function handleUse(code) {
  try {
    const r = await api({ action: 'use', barcode: code });
    toast(r.ok ? 'Fjernet: ' + r.name : r.error, !r.ok);
  } catch (e) { toast('Kunne ikke nå arket: ' + e.message, true); }
  setTimeout(startScan, 900);
}

/* ---------- Legg inn-modus ---------- */
async function handleAdd(code) {
  current = { barcode: code || '', brand: '', quantity: '' };
  $('scan').hidden = true; $('form').hidden = false;
  resetForm();
  if (!code) { $('name').focus(); return; }
  $('info').textContent = 'Slår opp ' + code + ' …';

  let found = null;
  try {
    const c = await api({ action: 'lookup', barcode: code });
    if (c.ok && c.found) found = { name: c.name, brand: c.brand, quantity: c.quantity, src: 'din liste' };
  } catch (e) { /* fortsett til Open Food Facts */ }

  if (!found) {
    try {
      const r = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) +
        '.json?fields=product_name,brands,quantity');
      const j = await r.json();
      if (j.status === 1 && j.product && j.product.product_name) {
        found = { name: j.product.product_name, brand: (j.product.brands || '').split(',')[0].trim(),
                  quantity: j.product.quantity || '', src: 'Open Food Facts' };
      }
    } catch (e) { /* manuell utfylling */ }
  }

  if (found) {
    current.brand = found.brand || ''; current.quantity = found.quantity || '';
    $('name').value = found.name;
    $('info').textContent = [found.brand, found.quantity].filter(Boolean).join(' · ') + (found.src ? '  (fra ' + found.src + ')' : '');
  } else {
    $('info').textContent = 'Ukjent strekkode. Skriv inn navnet én gang, så huskes det til neste gang.';
    $('name').focus();
  }
  validate();
}

function resetForm() {
  $('name').value = ''; $('bb').value = ''; $('limit').value = ''; $('info').textContent = '';
  loc = null;
  document.querySelectorAll('.loc button').forEach(b => b.setAttribute('aria-pressed', 'false'));
  validate();
}
function validate() { $('save').disabled = !($('name').value.trim() && loc && $('bb').value); }

document.querySelectorAll('.loc button').forEach(b => b.onclick = () => {
  loc = b.dataset.loc;
  document.querySelectorAll('.loc button').forEach(x => x.setAttribute('aria-pressed', x === b));
  validate();
});
$('quick').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = new Date();
  if (b.dataset.d) d.setDate(d.getDate() + Number(b.dataset.d));
  if (b.dataset.m) d.setMonth(d.getMonth() + Number(b.dataset.m));
  $('bb').value = iso(d); validate();
};
$('name').oninput = validate;
$('bb').onchange = validate;

$('cancel').onclick = startScan;
$('manual').onclick = async () => { await stopScan(); handleAdd(''); };

$('save').onclick = async () => {
  $('save').disabled = true;
  try {
    const r = await api({
      action: 'add', barcode: current.barcode, name: $('name').value.trim(),
      brand: current.brand, quantity: current.quantity,
      location: loc, bestBefore: $('bb').value, limit: $('limit').value
    });
    if (r.ok) { toast('Lagret: ' + $('name').value.trim()); startScan(); }
    else { toast(r.error || 'Noe gikk galt', true); validate(); }
  } catch (e) { toast('Kunne ikke nå arket: ' + e.message, true); validate(); }
};

/* ---------- Start ---------- */
setMode('add');
startScan();
</script>
</body>
</html>
